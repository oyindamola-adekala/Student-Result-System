<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account Type</title>

    <link rel="stylesheet" href="choose-signup.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <h1>Create an Account</h1>

    <p>Select how you want to register.</p>

    <div class="cards">

        <div class="card" onclick="goStudent()">

            <i class="fas fa-user-graduate"></i>

            <h2>Student</h2>

            <p>Create a student account to view your academic results.</p>

            <button>Continue</button>

        </div>

        <div class="card" onclick="goAdmin()">

            <i class="fas fa-user-shield"></i>

            <h2>Administrator</h2>

            <p>Create an administrator account to manage the system.</p>

            <button>Continue</button>

        </div>

    </div>

</div>

<script src="choose-signup.js"></script>

</body>
</html>
